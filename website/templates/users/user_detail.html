{% extends "base.html" %}

{% load static %}

{% block title %}
  User:
  {{ object.username }}
{% endblock title %}
{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <h1 class="h2">{{ object.username }}</h1>
        {% if object.name %}
          <p>{{ object.name }}</p>
        {% endif %}
      </div>
    </div>
    {% if object == request.user %}
      <!-- Action buttons -->
      <div class="row">
        <div class="col-sm-12 d-flex flex-wrap gap-2">
          <a class="btn btn-dark rounded-pill"
             href="{% url 'users:update' %}"
             role="button">My Info</a>
          <a class="btn btn-outline-dark rounded-pill"
             href="{% url 'account_email' %}"
             role="button">E-Mail</a>
          <a class="btn btn-outline-dark rounded-pill"
             href="{% url 'mfa_index' %}"
             role="button">MFA</a>
          <!-- Your Stuff: Custom user template urls -->
        </div>
      </div>
      <!-- End Action buttons -->
    {% endif %}
  </div>
{% endblock content %}
