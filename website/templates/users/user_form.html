{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}
  {{ user.username }}
{% endblock title %}
{% block content %}
  <h1 class="h2 mb-4">{{ user.username }}</h1>
  <form class="col-lg-6" method="post" action="{% url 'users:update' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-dark rounded-pill">Update</button>
  </form>
{% endblock content %}
